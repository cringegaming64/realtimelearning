name: Build GBA Pocket APK

on:
  push:
    branches: [chatgpt-gba-apk-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble local emulator assets
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=app/src/main/assets
          cat .build/app.part1.js .build/app.part2.js .build/app.part3.js > "$ASSETS/app.js"
          node --check "$ASSETS/app.js"
          curl -fsSL "https://raw.githubusercontent.com/WSeubring/pi-extension-gba/main/vendor/mgba-wasm/dist/mgba.js" -o "$ASSETS/mgba.js"
          curl -fsSL "https://raw.githubusercontent.com/WSeubring/pi-extension-gba/main/vendor/mgba-wasm/dist/mgba.wasm" -o "$ASSETS/mgba.wasm"
          curl -fsSL "https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js" -o "$ASSETS/fflate.js"
          curl -fsSL "https://raw.githubusercontent.com/mgba-emu/mgba/master/LICENSE" -o "$ASSETS/MGBA-MPL-2.0.txt"
          test -s "$ASSETS/mgba.js"
          test -s "$ASSETS/mgba.wasm"
          test -s "$ASSETS/fflate.js"
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euxo pipefail
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.openai.gbapocket/.MainActivity
            sleep 5
            PID=$(adb shell pidof com.openai.gbapocket | tr -d '\r')
            echo "PID=$PID"
            adb shell dumpsys activity activities | grep -A 8 -B 3 com.openai.gbapocket || true
            adb logcat -d -v brief | grep -E "AndroidRuntime|FATAL EXCEPTION|com.openai.gbapocket|chromium|crash" | tail -n 250 || true
            test -n "$PID"
      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk GBA-Pocket.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GBA-Pocket-APK
          path: GBA-Pocket.apk
          retention-days: 7
